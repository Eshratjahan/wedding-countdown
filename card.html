<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Jost:wght@400&display=swap">
<style>
  /* One static card per section, chosen with ?s=start|budget|expenses|seating|tasks|guests */
  :root {
    --bg: #fbf6f2; --ink: #5e3f40; --soft: #9a7c78; --gold: #c3a06b; --line: #ead9d3;
    --script: "Great Vibes", "Snell Roundhand", cursive;
    --ui: "Jost", "Avenir Next", "Segoe UI", sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  body { display: grid; place-items: center; padding: 6px; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  .card {
    position: relative; box-sizing: border-box;
    width: 100%; height: 100%;
    border: 1.5px solid var(--gold); padding: 8px;
    display: grid;
  }
  .inner {
    border: 1px solid var(--line);
    display: grid; align-content: center; justify-items: center; text-align: center; gap: min(3.2vh, 2vw);
    padding: 2% 6%;
  }
  .num { font: 400 clamp(9px, min(2.4vw, 5vh), 14px) var(--ui); letter-spacing: .4em; color: var(--soft); padding-left: .4em; }
  .name { font-family: var(--script); color: var(--ink); font-size: clamp(30px, min(13vw, 30vh), 104px); line-height: 1.05; }
  .rule { display: flex; align-items: center; gap: 8px; width: min(62%, 320px); }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: var(--gold); }
  .rule i { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
  .sub { font: 400 clamp(9px, min(2.4vw, 4.6vh), 13px) var(--ui); letter-spacing: .3em; text-transform: uppercase; color: var(--soft); padding-left: .3em; }

  /* Start here: a thin blush banner with a fixed wide shape, centred in whatever space Notion gives it */
  html.banner, html.banner body { background: transparent; }
  html.banner .card {
    height: auto; aspect-ratio: 4.2 / 1; max-height: 100%;
    background: #f6e4e1; border-color: var(--gold);
  }
  html.banner .inner { gap: min(1.6vh, 1.2vw); padding: 1% 4%; border-color: #ecd0cb; }
  html.banner .name { font-size: clamp(26px, min(7vw, 22vh), 64px); }
  html.banner .rule { width: min(40%, 220px); }
</style>
</head>
<body>
<div class="card"><div class="inner">
  <div class="num" id="num">01</div>
  <div class="name" id="name">Budget</div>
  <div class="rule" aria-hidden="true"><i></i></div>
  <div class="sub" id="sub">Plan every category</div>
</div></div>
<script>
  const CARDS = {
    start:    ["", "Start here", "Your 2-minute guide"],
    budget:   ["01", "Budget",   "Plan every category"],
    expenses: ["02", "Expenses", "Payments & deposits"],
    seating:  ["03", "Seating",  "Tables & seats"],
    tasks:    ["04", "Tasks",    "Your checklist"],
    guests:   ["05", "Guests",   "RSVPs & meals"],
  };
  const key = (new URLSearchParams(location.search).get("s") || "budget").toLowerCase();
  const c = CARDS[key] || CARDS.budget;
  if (key === "start") document.documentElement.classList.add("banner");
  document.getElementById("num").textContent = c[0];
  document.getElementById("num").hidden = !c[0];
  document.getElementById("name").textContent = c[1];
  document.getElementById("sub").textContent = c[2];
  document.title = c[1];
</script>
</body>
</html>
